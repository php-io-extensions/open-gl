name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Install EGL/GLES (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libegl-dev libgles-dev libwayland-dev

      - name: Build
        run: |
          phpize
          ./configure --enable-opengl
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Load
        # Surfaceless EGL / CGL tests need a GPU or a desktop session, same
        # as glfw and sdl3, so CI only builds and loads the module.
        run: |
          php -n -d extension="$PWD/modules/opengl.so" -r 'exit(extension_loaded("opengl") ? 0 : 1);'
          php -n -d extension="$PWD/modules/opengl.so" --ri opengl
